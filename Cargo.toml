[package]
name = "drift-index"
version = "0.3.0"
edition = "2024"
description = "Pinpoint any code in your repo. Fast codebase indexer for AI agents."
license = "MIT"
readme = "README.md"
repository = "https://github.com/The-Smithy/drift"
homepage = "https://github.com/The-Smithy/drift"
authors = ["The Smithy <max@thesmithy.io>"]
keywords = ["codebase", "indexer", "ai", "agent", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "drift"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
ignore = "0.4.34"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-gdscript = "6.1.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys = "0.1.49"
mimalloc = "0.1.52"
