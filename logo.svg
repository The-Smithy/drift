<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0d4"/>
      <stop offset="40%" stop-color="#c4b8a8"/>
      <stop offset="100%" stop-color="#8a7d6b"/>
    </linearGradient>
    <linearGradient id="heat" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="40%" stop-color="#f7931e"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="50%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#3d3530" stroke-width="2"/>

  <!-- Drift punch tool — tapered body -->
  <path d="M 236 80 L 276 80 L 282 120 L 284 200 L 286 320 L 280 400 L 272 430 L 240 430 L 232 400 L 226 320 L 228 200 L 230 120 Z"
        fill="url(#steel)" stroke="#555" stroke-width="1.5"/>

  <!-- Metal highlight on punch body -->
  <path d="M 248 85 L 268 85 L 272 120 L 274 200 L 275 300 L 248 300 L 249 200 L 250 120 Z"
        fill="url(#metal)" opacity="0.15"/>

  <!-- Knurl grip marks -->
  <line x1="232" y1="140" x2="280" y2="140" stroke="#555" stroke-width="1" opacity="0.6"/>
  <line x1="231" y1="155" x2="281" y2="155" stroke="#555" stroke-width="1" opacity="0.6"/>
  <line x1="230" y1="170" x2="282" y2="170" stroke="#555" stroke-width="1" opacity="0.6"/>
  <line x1="230" y1="185" x2="282" y2="185" stroke="#555" stroke-width="1" opacity="0.6"/>
  <line x1="229" y1="200" x2="283" y2="200" stroke="#555" stroke-width="1" opacity="0.6"/>
  <line x1="229" y1="215" x2="283" y2="215" stroke="#555" stroke-width="1" opacity="0.6"/>

  <!-- Heated tip glow -->
  <ellipse cx="256" cy="430" rx="30" ry="12" fill="#ff6b35" opacity="0.3" filter="url(#blur)"/>
  <path d="M 240 400 L 272 400 L 266 425 L 260 435 L 252 435 L 246 425 Z"
        fill="url(#heat)"/>

  <!-- Point tip -->
  <path d="M 252 435 L 260 435 L 258 445 L 256 450 L 254 445 Z"
        fill="#ffd700"/>

  <!-- Spark particles from the tip -->
  <circle cx="230" cy="440" r="2" fill="#ffd700" opacity="0.8"/>
  <circle cx="220" cy="435" r="1.5" fill="#ff6b35" opacity="0.6"/>
  <circle cx="285" cy="442" r="1.8" fill="#ffd700" opacity="0.7"/>
  <circle cx="295" cy="438" r="1.2" fill="#ff6b35" opacity="0.5"/>
  <circle cx="240" cy="448" r="1.5" fill="#f7931e" opacity="0.7"/>
  <circle cx="275" cy="450" r="1.3" fill="#f7931e" opacity="0.6"/>

  <!-- Text: DRIFT -->
  <text x="256" y="495" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="8" fill="#c4b8a8">DRIFT</text>
</svg>
